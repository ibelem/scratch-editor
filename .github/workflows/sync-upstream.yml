name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync from scratchfoundation/scratch-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          # A full history is needed so git can fast-forward merge upstream commits.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/scratchfoundation/scratch-editor.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Rebase onto upstream/develop
        # Replays fork-specific commits on top of upstream so the sync succeeds
        # even when this fork is ahead of upstream.
        run: git rebase upstream/develop

      - name: Push to fork
        run: git push origin HEAD --force-with-lease
