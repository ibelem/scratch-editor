    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background: #f0f4ff;
      color: #1e1e2e;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #4c2ecc;
      letter-spacing: .02em;
    }
    header p {
      margin-top: 6px;
      color: #666;
      font-size: .9rem;
    }

    .groups {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .group {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(76,46,204,.08);
      overflow: hidden;
    }
    .group-header {
      background: linear-gradient(135deg, #4c2ecc 0%, #7b5ff5 100%);
      color: #fff;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-header .badge {
      background: rgba(255,255,255,.22);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: .8rem;
      font-weight: 500;
    }

    .subgroup {
      border-top: 1px solid #f0f0f8;
    }
    .subgroup-title {
      padding: 10px 20px 6px;
      font-size: .78rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      padding: 8px 16px 16px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #f7f5ff;
      border: 1.5px solid transparent;
      cursor: pointer;
      text-decoration: none;
      color: #2d1b8e;
      font-size: .88rem;
      font-weight: 500;
      transition: background .15s, border-color .15s, transform .1s;
      line-height: 1.3;
      word-break: break-all;
    }
    .item:hover {
      background: #ede8ff;
      border-color: #7b5ff5;
      transform: translateY(-1px);
    }
    .item:active {
      transform: translateY(0);
    }
    .item .icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      font-weight: 700;
      color: #fff;
    }
    .icon-sb3  { background: #4c97ff; }
    .icon-sb2  { background: #ff8c1a; }
    .icon-sb   { background: #59c059; }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: .8rem;
      color: #aaa;
    }
  </style>
</head>

      "https://belem.github.io/scratch/Scratch编程从入门到精通/第13章-消息和事件/练习/13.4 小熊打车.sb2",

    /** Derive display label from a full URL: take the filename, strip extension. */
    function label(url) {
      const filename = url.split('/').pop();
      return filename.replace(/\.sb[23]?$/i, '');
    }

    /** Return the file extension in lower case: 'sb3', 'sb2', or 'sb'. */
    function ext(url) {
      const m = url.match(/\.(sb[23]?)$/i);
      return m ? m[1].toLowerCase() : 'sb3';
    }

    /**
     * Classify each URL into a top-level group key and an optional subgroup key.
     * Returns { group, subgroup }.
     */
    function classify(url) {
      const base = 'https://belem.github.io/scratch/';
      const rel = url.slice(base.length);   // e.g. "a33/01-海底世界.sb3"
      const parts = rel.split('/');

      if (parts[0] === 'a33') return { group: 'a33', subgroup: null };
      if (parts[0] === 'b31') return { group: 'b31', subgroup: null };
      if (parts[0].startsWith('Scratch编程')) {
        // parts[1] is e.g. "第10章-绘图"
        const chap = parts[1] || '其它';
        return { group: 'book', subgroup: chap };
      }
      return { group: 'other', subgroup: null };
    }

    // ── Build ordered data structure ─────────────────────────────────────────

    const TOP_GROUPS = [
      { key: 'book',  label: 'Scratch 编程从入门到精通', icon: '📖' },
      { key: 'a33',   label: 'A 阶段 33 课', icon: '🎮' },
      { key: 'b31',   label: 'B 阶段 31 课', icon: '🚀' },
    ];

    // Map: groupKey → Map<subgroupKey, url[]>
    const data = {};
    TOP_GROUPS.forEach(g => { data[g.key] = new Map(); });

    PROJECTS.forEach(url => {
      const { group, subgroup } = classify(url);
      if (!data[group]) return;
      const sg = subgroup || '__root__';
      if (!data[group].has(sg)) data[group].set(sg, []);
      data[group].get(sg).push(url);
    });

    // ── Render ───────────────────────────────────────────────────────────────

    const root = document.getElementById('root');

    TOP_GROUPS.forEach(({ key, label: groupLabel, icon }) => {
      const map = data[key];
      if (!map || map.size === 0) return;

      const totalCount = [...map.values()].reduce((s, a) => s + a.length, 0);

      const section = document.createElement('div');
      section.className = 'group';

      const hdr = document.createElement('div');
      hdr.className = 'group-header';
      hdr.innerHTML =
        `${icon} ${groupLabel} <span class="badge">${totalCount} 个作品</span>`;
      section.appendChild(hdr);

      map.forEach((urls, sg) => {
        const container = document.createElement('div');
        container.className = 'subgroup';

        if (sg !== '__root__') {
          const title = document.createElement('div');
          title.className = 'subgroup-title';
          // "第10章-绘图" → "第10章 绘图"
          title.textContent = sg.replace(/-/g, ' ');
          container.appendChild(title);
        }

        const grid = document.createElement('div');
        grid.className = 'items';

        urls.forEach(url => {
          const e = ext(url);
          const a = document.createElement('a');
          a.className = 'item';
          a.href = '/?url=' + encodeURIComponent(url);
          // Open in same tab so the browser back button brings them here
          a.innerHTML =
            `<span class="icon icon-${e}">${e.toUpperCase()}</span>${label(url)}`;
          grid.appendChild(a);
        });

        container.appendChild(grid);
        section.appendChild(container);
      });

      root.appendChild(section);
    });
  </script>
